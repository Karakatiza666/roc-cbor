[package]
name = "cbor-bench"
version = "0.1.0"
edition = "2021"
publish = false

[dependencies]
ciborium = "0.2"
cbor4ii = { version = "1", features = ["serde1", "use_std", "half-f16"] }
serde = { version = "1", features = ["derive"] }
serde_bytes = "0.11"

[profile.release]
opt-level = 3
lto = true
codegen-units = 1
