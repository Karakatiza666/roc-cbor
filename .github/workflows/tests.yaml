name: Tests
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
    inputs:
      roc-nightly:
        description: A tag of roc-lang/nightlies in place of .roc-version
        required: false
        default: ""
  workflow_call:
    inputs:
      roc-nightly: { required: false, type: string, default: "" }
permissions: {}
concurrency:
  group: tests-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true
jobs:
  bundle:
    runs-on: ubuntu-24.04
    permissions: { contents: read }
    steps:
      - uses: actions/checkout@v7
      - uses: ./.github/actions/setup-roc
        with: { token: "${{ github.token }}", nightly-tag: "${{ inputs.roc-nightly || '' }}" }
      - run: scripts/bundle.sh
      - uses: actions/upload-artifact@v7
        with: { name: bundle, path: dist, if-no-files-found: error }
  test:
    needs: bundle
    runs-on: ${{ matrix.os }}
    permissions: { contents: read }
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, ubuntu-24.04-arm, macos-15]
    steps:
      - uses: actions/checkout@v7
      - uses: ./.github/actions/setup-roc
        with: { token: "${{ github.token }}", nightly-tag: "${{ inputs.roc-nightly || '' }}" }
      - run: scripts/all_tests.sh
      - uses: actions/download-artifact@v8
        with: { name: bundle, path: dist }
      - run: scripts/test_bundle.sh
  fuzz:
    runs-on: ubuntu-24.04
    permissions: { contents: read }
    steps:
      - uses: actions/checkout@v7
      - uses: ./.github/actions/setup-roc
        with: { token: "${{ github.token }}", nightly-tag: "${{ inputs.roc-nightly || '' }}" }
      - run: scripts/fuzz.sh
      - if: failure()
        uses: actions/upload-artifact@v7
        with: { name: fuzz-failures, path: .cache/fuzz/art-*, if-no-files-found: ignore }
  # Complexity of the writer and the reader: each case must stay linear (n log n for a key sort).
  # A smaller item budget keeps the job short; a complexity bug still gives a ratio of 4 or more.
  scale:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    permissions: { contents: read }
    steps:
      - uses: actions/checkout@v7
      - uses: ./.github/actions/setup-roc
        with: { token: "${{ github.token }}", nightly-tag: "${{ inputs.roc-nightly || '' }}" }
      - run: scripts/scale.sh 3
        env: { SCALE_ITEMS: "200000" }
  # Cbor.Value against Python cbor2 (pinned version).
  differential:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    permissions: { contents: read }
    steps:
      - uses: actions/checkout@v7
      - uses: ./.github/actions/setup-roc
        with: { token: "${{ github.token }}", nightly-tag: "${{ inputs.roc-nightly || '' }}" }
      - run: python3 -m venv .cache/venv && .cache/venv/bin/pip install cbor2==6.2.1
      - run: scripts/differential.sh
        env: { DIFF_STRICT: "1" }
  # Speed against bench/baseline.txt. Report only: a shared runner is noisy and is not the baseline machine.
  bench:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    continue-on-error: true
    permissions: { contents: read }
    steps:
      - uses: actions/checkout@v7
      - uses: ./.github/actions/setup-roc
        with: { token: "${{ github.token }}", nightly-tag: "${{ inputs.roc-nightly || '' }}" }
      - run: scripts/bench.sh --check 5
